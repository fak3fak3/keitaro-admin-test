services:
  api:
    build: ./backend
    env_file: backend/.env
    environment:
      # SQLite в именованном томе: данные переживают пересоздание контейнера
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
    volumes:
      - data:/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  data:
